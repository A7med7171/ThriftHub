<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | ThriftHub</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/profile.css">

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-success fs-3" href="index.html">
            ThriftHub
        </a>

        <div class="d-flex gap-4 fs-4">

            <a href="favorites.html" class="text-dark">
                <i class="bi bi-heart"></i>
            </a>

            <a href="cart.html" class="text-dark">
                <i class="bi bi-cart3"></i>
            </a>

            <a href="profile.html" class="text-success">
                <i class="bi bi-person-circle"></i>
            </a>

        </div>

    </div>

</nav>

<!-- COVER -->

<div class="cover-photo"></div>

<!-- PROFILE -->

<div class="container">

    <div class="text-center">

        <img
                src="../images/uesrs/user1.jfif"
                class="profile-image">

        <h2 class="mt-3 fw-bold">
            Ahmed Ali
        </h2>

        <p class="text-muted">

            Computer Engineering Student

        </p>

        <p>

            📍 Cairo, Egypt

        </p>

    </div>

    <!-- STATS -->

    <div class="row text-center mt-4">

        <div class="col">

            <h4>152</h4>

            <p>Followers</p>

        </div>

        <div class="col">

            <h4>85</h4>

            <p>Following</p>

        </div>

        <div class="col">

            <h4>23</h4>

            <p>Listings</p>

        </div>

    </div>

    <!-- BUTTONS -->

    <div class="text-center mt-3">

        <button class="btn btn-success px-4">

            Edit Profile

        </button>

        <button class="btn btn-outline-dark px-4 ms-2">

            Share Profile

        </button>

    </div>

    <!-- ABOUT -->

    <div class="card shadow-sm mt-5 p-4">

        <h4>

            About

        </h4>

        <p>

            👕 Vintage Clothing Lover

            <br>

            👟 Sneaker Collector

            <br>

            📦 Fast Shipping

        </p>

    </div>

    <!-- MY LISTINGS -->

    <h3 class="mt-5 mb-4">

        My Listings

    </h3>

    <div class="row g-4">

        <div class="col-lg-3 col-md-4 col-sm-6">

            <div class="card listing-card">

                <img src="../images/products/product1.jfif">

                <div class="card-body">

                    <h6>Vintage Hoodie</h6>

                    <h5 class="text-success">

                        650 EGP

                    </h5>

                </div>

            </div>

        </div>

        <div class="col-lg-3 col-md-4 col-sm-6">

            <div class="card listing-card">

                <img src="../images/products/product2.jfif">

                <div class="card-body">

                    <h6>Luxury Watch</h6>

                    <h5 class="text-success">

                        850 EGP

                    </h5>

                </div>

            </div>

        </div>

        <div class="col-lg-3 col-md-4 col-sm-6">

            <div class="card listing-card">

                <img src="../images/products/product3.jfif">

                <div class="card-body">

                    <h6>Nike Sneakers</h6>

                    <h5 class="text-success">

                        1200 EGP

                    </h5>

                </div>

            </div>

        </div>

        <div class="col-lg-3 col-md-4 col-sm-6">

            <div class="card listing-card">

                <img src="../images/products/product4.jfif">

                <div class="card-body">

                    <h6>Leather Jacket</h6>

                    <h5 class="text-success">

                        980 EGP

                    </h5>

                </div>

            </div>

        </div>

    </div>
