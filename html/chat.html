<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | ThriftHub</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/chat.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container">
        <!-- Logo -->
        <a class="navbar-brand text-success me-4" href="index.html">
            ThriftHub
        </a>

        <!-- Search -->
        <form class="d-none d-md-flex mx-auto w-50" onsubmit="event.preventDefault(); window.location.href='index.html?search=' + encodeURIComponent(this.querySelector('input').value);">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" class="form-control border-start-0 ps-0" placeholder="Search clothes, brands, sellers...">
            </div>
        </form>

        <!-- Right Icons -->
        <div class="d-flex align-items-center gap-2 gap-sm-3 ms-auto">
            <a href="index.html" class="nav-icon-link" title="Home">
                <i class="bi bi-house-door"></i>
            </a>

            <a href="favorites.html" class="nav-icon-link" title="Favorites">
                <i class="bi bi-heart"></i>
                <span id="fav-count" class="badge rounded-pill bg-danger badge-counter">0</span>
            </a>

            <a href="cart.html" class="nav-icon-link" title="Cart">
                <i class="bi bi-cart3"></i>
                <span id="cart-count" class="badge rounded-pill bg-success badge-counter">0</span>
            </a>

            <a href="chat.html" class="nav-icon-link text-primary" title="Messages / DMs">
                <i class="bi bi-chat-dots-fill"></i>
                <span id="dms-count" class="badge rounded-pill bg-primary badge-counter">2</span>
            </a>

            <a href="sell.html" class="btn btn-success btn-sell-nav d-none d-sm-inline-flex align-items-center gap-1">
                <i class="bi bi-plus-circle-fill"></i> Sell
            </a>

            <a href="profile.html" class="nav-icon-link" title="Profile">
                <i class="bi bi-person-circle"></i>
            </a>
        </div>
    </div>
</nav>

<!-- CHAT INTERFACE -->
<div class="chat-container">

    <!-- LEFT SIDE: CONVERSATION LIST -->
    <div class="chat-list">
        <div class="chat-header">
            <h4 class="fw-bold m-0"><i class="bi bi-chat-dots text-success me-2"></i>Direct Messages</h4>
            <input type="text" id="chatSearch" class="form-control rounded-pill mt-3" placeholder="Search conversations...">
        </div>
        <div id="chatUsers">
            <!-- Dynamic chats list -->
        </div>
    </div>

    <!-- RIGHT SIDE: ACTIVE CHAT WINDOW -->
    <div class="chat-window">
        <!-- Header -->
        <div class="conversation-header">
            <img id="sellerAvatar" src="../images/uesrs/user1.jfif" class="avatar">
            <div>
                <h5 id="sellerName" class="fw-bold m-0">Ahmed Ali</h5>
                <small id="productName" class="text-muted">Vintage Nike Hoodie</small>
            </div>
        </div>

        <!-- Messages Area -->
        <div id="messages" class="messages">
            <!-- Dynamic messages -->
        </div>

        <!-- Input Area -->
        <div class="message-input">
            <input id="messageText" type="text" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
    </div>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/chat.js"></script>
</body>
</html>
