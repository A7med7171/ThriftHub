<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites | ThriftHub</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top mb-4">
    <div class="container">
        <!-- Logo -->
        <a class="navbar-brand text-success me-4" href="index.html">
            ThriftHub
        </a>

        <!-- Search -->
        <form class="d-none d-md-flex mx-auto w-50" onsubmit="event.preventDefault(); window.location.href='index.html?search=' + encodeURIComponent(this.querySelector('input').value);">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" class="form-control border-start-0 ps-0" placeholder="Search clothes, brands, sellers...">
            </div>
        </form>

        <!-- Navigation Links -->
        <div class="d-flex align-items-center gap-2 gap-sm-3 ms-auto">
            <a href="index.html" class="nav-icon-link" title="Home">
                <i class="bi bi-house-door"></i>
            </a>

            <a href="favorites.html" class="nav-icon-link text-danger" title="Favorites">
                <i class="bi bi-heart-fill"></i>
                <span id="fav-count" class="badge rounded-pill bg-danger badge-counter">0</span>
            </a>

            <a href="cart.html" class="nav-icon-link" title="Cart">
                <i class="bi bi-cart3"></i>
                <span id="cart-count" class="badge rounded-pill bg-success badge-counter">0</span>
            </a>

            <a href="chat.html" class="nav-icon-link" title="Messages / DMs">
                <i class="bi bi-chat-dots"></i>
                <span id="dms-count" class="badge rounded-pill bg-primary badge-counter">2</span>
            </a>

            <a href="sell.html" class="btn btn-success btn-sell-nav d-none d-sm-inline-flex align-items-center gap-1">
                <i class="bi bi-plus-circle-fill"></i> Sell
            </a>

            <a href="profile.html" class="nav-icon-link" title="Profile">
                <i class="bi bi-person-circle"></i>
            </a>
        </div>
    </div>
</nav>

<!-- ================= MAIN CONTAINER ================= -->
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold m-0"><i class="bi bi-heart-fill text-danger me-2"></i>My Saved Favorites</h2>
            <p class="text-muted m-0 mt-1">Items you loved and saved for later</p>
        </div>
        <a href="index.html" class="btn btn-outline-dark rounded-pill px-3">
            <i class="bi bi-arrow-left me-1"></i> Continue Shopping
        </a>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="text-center py-5 d-none bg-white rounded-4 shadow-sm p-4">
        <i class="bi bi-heartbreak text-muted display-1"></i>
        <h4 class="mt-3 fw-bold">No saved items yet!</h4>
        <p class="text-muted">Explore the marketplace and click the heart icon on any product to save it here.</p>
        <a href="index.html" class="btn btn-success rounded-pill px-4 mt-2">
            <i class="bi bi-bag-plus me-1"></i> Discover Products
        </a>
    </div>

    <!-- Products Grid -->
    <div id="favorites-grid" class="products-grid">
        <!-- Rendered dynamically via js/favorites.js -->
    </div>
</div>

<!-- Footer -->
<footer>
    <div class="container">
        <p class="mb-0">© 2026 <strong>ThriftHub</strong> - Sustainable Second-hand Fashion Marketplace.</p>
    </div>
</footer>

<!-- JS Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/favorites.js"></script>
</body>
</html>
