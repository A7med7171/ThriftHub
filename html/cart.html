<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart & Orders | ThriftHub</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>
<body class="bg-light">

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top mb-4">
    <div class="container">
        <!-- Logo -->
        <a class="navbar-brand text-success me-4" href="index.html">
            ThriftHub
        </a>

        <!-- Search -->
        <form class="d-none d-md-flex mx-auto w-50" onsubmit="event.preventDefault(); window.location.href='index.html?search=' + encodeURIComponent(this.querySelector('input').value);">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" class="form-control border-start-0 ps-0" placeholder="Search clothes, brands, sellers...">
            </div>
        </form>

        <!-- Right Icons -->
        <div class="d-flex align-items-center gap-2 gap-sm-3 ms-auto">
            <a href="index.html" class="nav-icon-link" title="Home">
                <i class="bi bi-house-door"></i>
            </a>

            <a href="favorites.html" class="nav-icon-link" title="Favorites">
                <i class="bi bi-heart"></i>
                <span id="fav-count" class="badge rounded-pill bg-danger badge-counter">0</span>
            </a>

            <a href="cart.html" class="nav-icon-link text-success" title="Cart">
                <i class="bi bi-cart3"></i>
                <span id="cart-count" class="badge rounded-pill bg-success badge-counter">0</span>
            </a>

            <a href="chat.html" class="nav-icon-link" title="Messages / DMs">
                <i class="bi bi-chat-dots"></i>
                <span id="dms-count" class="badge rounded-pill bg-primary badge-counter">2</span>
            </a>

            <a href="sell.html" class="btn btn-success btn-sell-nav d-none d-sm-inline-flex align-items-center gap-1">
                <i class="bi bi-plus-circle-fill"></i> Sell
            </a>

            <a href="profile.html" class="nav-icon-link" title="Profile">
                <i class="bi bi-person-circle"></i>
            </a>
        </div>
    </div>
</nav>

<!-- ================= MAIN CONTENT ================= -->
<div class="container py-4">

    <!-- Nav Tabs -->
    <ul class="nav nav-pills mb-4 bg-white p-2 rounded-4 shadow-sm justify-content-center" id="cartTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-item-btn btn btn-outline-success rounded-pill px-4 me-2 active" id="cart-tab" data-bs-toggle="pill" data-bs-target="#cart-pane" type="button" role="tab">
                <i class="bi bi-cart-check me-2"></i>Shopping Cart (<span id="cart-tab-count">0</span>)
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-item-btn btn btn-outline-success rounded-pill px-4" id="orders-tab" data-bs-toggle="pill" data-bs-target="#orders-pane" type="button" role="tab">
                <i class="bi bi-box-seam me-2"></i>My Orders & Tracking
            </button>
        </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content" id="cartTabContent">
        
        <!-- PANE 1: SHOPPING CART -->
        <div class="tab-pane fade show active" id="cart-pane" role="tabpanel">
            <div class="row g-4" id="cart-container">
                <!-- Left: Cart Items List -->
                <div class="col-lg-8">
                    <div class="bg-white p-4 rounded-4 shadow-sm">
                        <h4 class="fw-bold mb-4">Cart Items</h4>
                        <div id="cart-items-list">
                            <!-- Dynamic Cart Items -->
                        </div>
                    </div>
                </div>

                <!-- Right: Summary Card -->
                <div class="col-lg-4">
                    <div class="bg-white p-4 rounded-4 shadow-sm">
                        <h4 class="fw-bold mb-3">Order Summary</h4>
                        <hr>
                        <div class="d-flex justify-content-between mb-2 fs-6 text-secondary">
                            <span>Subtotal</span>
                            <span id="summary-subtotal" class="fw-bold text-dark">0 EGP</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2 fs-6 text-secondary">
                            <span>Estimated Shipping</span>
                            <span id="summary-shipping" class="fw-bold text-dark">50 EGP</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4 fs-4 fw-bold">
                            <span>Total</span>
                            <span id="summary-total" class="text-success">50 EGP</span>
                        </div>

                        <button id="checkout-btn" class="btn btn-success btn-lg w-100 rounded-3 fw-bold py-3 shadow-sm">
                            <i class="bi bi-credit-card me-2"></i> Proceed to Checkout
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANE 2: MY ORDERS -->
        <div class="tab-pane fade" id="orders-pane" role="tabpanel">
            <div id="orders-list">
                <!-- Dynamic Orders List -->
            </div>
        </div>

    </div>

</div>

<!-- Footer -->
<footer>
    <div class="container">
        <p class="mb-0">© 2026 <strong>ThriftHub</strong> - Sustainable Second-hand Fashion Marketplace.</p>
    </div>
</footer>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/cart.js"></script>
</body>
</html>
