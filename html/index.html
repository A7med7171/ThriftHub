<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ThriftHub</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top mb-4">

    <div class="container">

        <!-- Logo -->

        <a class="navbar-brand fw-bold fs-3 text-success" href="#">
            ThriftHub
        </a>

        <!-- Search -->

        <form class="d-flex mx-auto w-50">

            <div class="input-group">

                <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search"></i>
                </span>

                <input
                        type="text"
                        class="form-control border-start-0"
                        placeholder="Search clothes, brands, sellers...">

            </div>

        </form>

        <!-- Right Icons -->

        <div class="d-flex align-items-center gap-4">

            <a href="favorites.html" class="text-dark fs-4 position-relative">

                <i class="bi bi-heart"></i>

            </a>

            <a href="cart.html" class="text-dark fs-4 position-relative">

             <span id="cart-count"
      class="position-absolute
             top-0
             start-100
             translate-middle
             badge
             rounded-pill
             bg-success">

    0

</span>

            </a>

            <a href="profile.html" class="text-dark fs-4">

                <i class="bi bi-person-circle"></i>

            </a>

        </div>

    </div>

</nav>

<!-- ================= CAROUSEL ================= -->

<div class="container">


<div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="../images/products/ha.png" class="d-block w-100 " alt="...">
    </div>
    <div class="carousel-item">
      <img src="../images/products/chatgpt.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="../images/products/chatgpt2.png" class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
</div>


<section  class="container-fluid px-0">

    <!-- Paste your carousel here -->

</section>

<!-- ================= FEED ================= -->

<section class="container mt-5">

    <h2 class="mb-4 fw-bold">
        Latest Products
    </h2>

    <div id="feed" class="products-grid">

    </div>

</section>
<!-- Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-body">

                <button
                        class="btn-close float-end"
                        data-bs-dismiss="modal">
                </button>

                <img
                        id="modalImage"
                        class="img-fluid rounded w-100">

                <h3 class="mt-3" id="modalTitle"></h3>

                <h4 class="text-success" id="modalPrice"></h4>

                <p id="modalLikes"></p>

                <button class="btn btn-success w-100">

                    Add to Cart

                </button>

            </div>

        </div>

    </div>

</div>
<!-- ================= OFFER MODAL ================= -->

<div class="modal fade" id="offerModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h4 class="modal-title">

                    Make an Offer

                </h4>

                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <img
                        id="offerImage"
                        class="img-fluid rounded mb-3">

                <h4 id="offerTitle"></h4>

                <h3 class="text-success" id="originalPrice">
                    650 EGP
                </h3>

                <hr>

                <label class="fw-bold">

                    Your Offer

                </label>

                <input
                        type="range"
                        id="offerSlider"
                        class="form-range">

                <h2
                        class="text-center mt-3"
                        id="offerValue">

                    650 EGP

                </h2>

                <hr>

                <div class="d-grid gap-3">

                    <button
                            id="buyNowBtn"
                            class="btn btn-success">

                        🛒 Buy at Full Price

                    </button>

                    <button
                            id="sendOfferBtn"
                            class="btn btn-warning">

                        💰 Send Offer

                    </button>

                    <button onclick="window.location.href='chat.html';"
                            id="chatSellerBtn"
                            class="btn btn-outline-dark">

                        💬 Chat Seller

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/cartManager.js"></script>
<script src="../js/home.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/home.js"></script>
</body>
</html>
